services:
  # ========================================================
  # API Gateway (Public Entry Point)
  # ========================================================
  - type: web
    name: campusconnect-api-gateway
    env: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
      - key: ORDER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-order-service
          property: host

  # ========================================================
  # User Microservice (Web Service)
  # ========================================================
  - type: web
    name: campusconnect-user-service
    env: docker
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./user-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3001
      - key: MONGO_URI
        sync: false

  # ========================================================
  # Product Microservice (Web Service)
  # ========================================================
  - type: web
    name: campusconnect-product-service
    env: docker
    dockerfilePath: ./product-service/Dockerfile
    dockerContext: ./product-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3002
      - key: MONGO_URI
        sync: false

  # ========================================================
  # Order Microservice (Web Service)
  # ========================================================
  - type: web
    name: campusconnect-order-service
    env: docker
    dockerfilePath: ./order-service/Dockerfile
    dockerContext: ./order-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3003
      - key: MONGO_URI
        sync: false
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
